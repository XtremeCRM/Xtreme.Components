name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  CI: 'true'

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Xtreme.Components.slnx

      - name: Build
        run: dotnet build Xtreme.Components.slnx -c Release --no-restore

      - name: Test
        run: |
          if ls tests/*/*.csproj > /dev/null 2>&1; then
            dotnet test Xtreme.Components.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results
          else
            echo "No test projects yet."
          fi

      # Every PR packs a throwaway version so a consumer can try the build before it is tagged.
      # No --no-build: Uno.Sdk's pack invokes Build for its library layout (NETSDK1085 otherwise).
      - name: Pack (0.0.0-ci)
        run: dotnet pack Xtreme.Components.slnx -c Release --no-restore -p:Version=0.0.0-ci.${{ github.run_number }} -o artifacts/packages

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-ci-${{ github.run_number }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/test-results/**
          if-no-files-found: ignore
