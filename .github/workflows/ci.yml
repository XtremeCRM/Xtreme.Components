name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  CI: 'true'

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/Directory.*.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Xtreme.Components.slnx

      - name: Build
        run: dotnet build Xtreme.Components.slnx -c Release --no-restore

      - name: Test
        run: |
          if ls tests/*/*.csproj > /dev/null 2>&1; then
            dotnet test Xtreme.Components.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory artifacts/test-results
          else
            echo "No test projects yet."
          fi

      # Every PR packs a throwaway version so a consumer can try the build before it is tagged.
      # No --no-build: Uno.Sdk's pack invokes Build for its library layout (NETSDK1085 otherwise).
      - name: Pack (0.0.0-ci)
        run: dotnet pack Xtreme.Components.slnx -c Release --no-restore -p:Version=0.0.0-ci.${{ github.run_number }} -o artifacts/packages

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packages-ci-${{ github.run_number }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
            artifacts/test-results/**
          if-no-files-found: ignore

  gallery:
    name: Gallery (WebAssembly)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-gallery-${{ hashFiles('global.json', '**/Directory.*.props', '**/*.csproj') }}
          restore-keys: nuget-gallery-
      - name: Publish the gallery for GitHub Pages
        run: >
          dotnet publish samples/Xtreme.Components.Gallery/Xtreme.Components.Gallery.csproj
          -c Release -f net10.0-browserwasm -o artifacts/gallery
          -p:GalleryBasePath=/Xtreme.Components/
      - name: Add a .nojekyll marker
        run: touch artifacts/gallery/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/gallery/wwwroot

  pages:
    name: Deploy gallery to GitHub Pages
    needs: [build, gallery]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
